# GET.route on the office NAS (see README.md): Waze route servers that
# GET.ride's Fare AI calls. Each container has its own Chrome, so its own
# reCAPTCHA tokens (about 25 Waze calls a minute each). In Admin › Fare AI,
# add each one as a Waze server and give it an area (country / state /
# city / suburb) to split the load.
#
# Reached only through one Cloudflare Tunnel, so no port is opened on the
# NAS or the router. In the tunnel, add one public hostname per container:
#
#   route1.getride.my -> http://get-route-1:8000
#   route2.getride.my -> http://get-route-2:8000
#   route3.getride.my -> http://get-route-3:8000
#
# Every call but /health needs X-Route-Key (ROUTE_API_KEY). Need more?
# Copy a get-route-N block, give it the next number, and add its hostname.
# Each container uses about 1.5 GB of memory (capped at 2 GB).
x-get-route: &get-route
  build: ../..
  platform: linux/amd64
  image: get-route:1
  restart: unless-stopped
  # Chrome needs a large /dev/shm.
  shm_size: 800m
  environment:
    PORT: "8000"
    ROUTE_API_KEY: ${ROUTE_API_KEY:?Set ROUTE_API_KEY in .env (openssl rand -hex 32)}
  expose:
    - "8000"
  mem_limit: 2g

services:
  get-route-1:
    <<: *get-route
    container_name: get-route-1

  get-route-2:
    <<: *get-route
    container_name: get-route-2

  get-route-3:
    <<: *get-route
    container_name: get-route-3

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    container_name: get-route-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env}
    depends_on:
      - get-route-1
      - get-route-2
      - get-route-3
    mem_limit: 256m
